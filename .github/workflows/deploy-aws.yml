name: Deploy to AWS

on:
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

env:
  AWS_REGION: ${{ vars.AWS_REGION }}
  SITE_BUCKET_NAME: ${{ vars.SITE_BUCKET_NAME }}
  API_ENDPOINT_URL: ${{ vars.API_ENDPOINT_URL }}

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Check required configuration
        run: |
          test -n "${AWS_REGION}" || { echo "Missing repository variable AWS_REGION"; exit 1; }
          test -n "${SITE_BUCKET_NAME}" || { echo "Missing repository variable SITE_BUCKET_NAME"; exit 1; }
          test -n "${{ secrets.AWS_ROLE_ARN }}" || { echo "Missing repository secret AWS_ROLE_ARN"; exit 1; }

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-region: ${{ env.AWS_REGION }}
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          role-session-name: kidstaskclock-deploy

      - name: Confirm bucket exists
        run: |
          aws s3api head-bucket --bucket "${SITE_BUCKET_NAME}"

      - name: Inject API endpoint into HTML
        run: |
          # Create a temporary config file with API endpoint
          cat > /tmp/api-config.js << 'EOF'
          // API Configuration - injected during deployment
          const API_ENDPOINT = "${{ env.API_ENDPOINT_URL }}";
          EOF
          
          # Prepend API config to script.js
          cat /tmp/api-config.js src/script.js > src/script.js.tmp && mv src/script.js.tmp src/script.js

      - name: Upload site files
        run: |
          aws s3 sync src/ "s3://${SITE_BUCKET_NAME}" \
            --delete \
            --exact-timestamps

      - name: Set content type for HTML entry point
        run: |
          aws s3 cp src/index.html "s3://${SITE_BUCKET_NAME}/index.html" \
            --content-type "text/html; charset=utf-8" \
            --metadata-directive REPLACE

      - name: Deployment summary
        run: |
          SITE_URL="http://${SITE_BUCKET_NAME}.s3-website-${AWS_REGION}.amazonaws.com"
          echo "========================================" 
          echo "✓ Deployment Complete"
          echo "========================================"
          echo ""
          echo "Website URL: ${SITE_URL}"
          echo "API Endpoint: ${API_ENDPOINT_URL}"
          echo ""
          echo "Site URL: ${SITE_URL}" >> "${GITHUB_STEP_SUMMARY}"
          echo "API Endpoint: ${API_ENDPOINT_URL}" >> "${GITHUB_STEP_SUMMARY}"
